name: CMake CI

on:
  push:
  pull_request:

jobs:

  build:
    name: Build - ${{ matrix.os }} ${{ matrix.arch }}

    strategy:
      fail-fast: false

      matrix:
        include:

          # ================================================
          # Linux x64
          # ================================================

          - os: Linux
            arch: x64
            runner: ubuntu-24.04

          # ================================================
          # Linux ARM64
          # ================================================

          - os: Linux
            arch: arm64
            runner: ubuntu-24.04-arm

          # ================================================
          # Windows x64
          # ================================================

          - os: Windows
            arch: x64
            runner: windows-2025

          # ================================================
          # Windows ARM64
          # ================================================

          - os: Windows
            arch: arm64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    env:
      BUILD_TYPE: Debug
      INSTALL_PREFIX: ${{ github.workspace }}/.local

    steps:

      # ====================================================
      # Checkout
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ====================================================
      # Linux build tools
      # ====================================================

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential

      # ====================================================
      # Check toolchain
      # ====================================================

      - name: Check Linux toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --version
          gcc --version
          g++ --version
          ninja --version

      - name: Check Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          cmake --help | Select-String "Visual Studio"

      # ====================================================
      # Install gRPC + Protobuf
      # ====================================================

      - name: Install gRPC and Protobuf - Linux
        if: runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x .github/scripts/linux/install_grpc.sh
          ./.github/scripts/linux/install_grpc.sh

      - name: Install gRPC and Protobuf - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          .\.github\scripts\windows\install_grpc.ps1

      # ====================================================
      # Show installed dependencies
      # ====================================================

      - name: Verify installed dependencies - Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Installed files:"
          find "${INSTALL_PREFIX}" -maxdepth 4 -type f | sort
          
          echo ""
          echo "Protobuf:"
          ls -la "${INSTALL_PREFIX}/lib/cmake/protobuf"
          
          echo ""
          echo "gRPC:"
          ls -la "${INSTALL_PREFIX}/lib/cmake/grpc"

      - name: Verify installed dependencies - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Installed files:"
          Get-ChildItem -Recurse $env:INSTALL_PREFIX

      # ====================================================
      # Configure CMake
      # ====================================================

      - name: Configure CMake - Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${{ env.INSTALL_PREFIX }}" \
            -DPAHO_WITH_MQTT_C=TRUE

      - name: Configure CMake - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF `
            -DCMAKE_PREFIX_PATH="$env:INSTALL_PREFIX" `
            -DPAHO_WITH_MQTT_C=TRUE

      # ====================================================
      # Build
      # ====================================================

      - name: Build
        shell: bash
        run: |
          cmake \
            --build build \
            --parallel

      # ====================================================
      # Unit tests
      # ====================================================

      - name: Run unit tests
        shell: bash
        run: |
          ctest \
            --test-dir build \
            --output-on-failure \
            -C ${{ env.BUILD_TYPE }}
